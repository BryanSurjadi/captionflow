services:
  postgres:
    image: postgres:17-alpine
    container_name: captionflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: captionflow
      POSTGRES_USER: captionflow
      POSTGRES_PASSWORD: captionflow
    ports:
      - "5432:5432"
    volumes:
      - captionflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U captionflow -d captionflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  captionflow_postgres_data:
